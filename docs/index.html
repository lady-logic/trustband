<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustBand Pforzheim</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <span class="wm">TrustBand</span>
    <div class="grow"></div>
    <button id="live-btn" class="livebtn"><i></i><span>Live-Daten</span></button>
    <div class="save"><span>Ersparnis in <i id="save-y">5</i> Jahren</span><b id="saving">–</b></div>
  </header>

  <div id="live-pop" class="pop" hidden>
    <b>Live-Daten aus niotix</b>
    <input type="password" id="live-key" placeholder="API-Schlüssel" autocomplete="off" spellcheck="false">
    <button class="btn" id="live-go">Abrufen</button>
    <div id="live-status" class="cap"></div>
  </div>

  <main>
    <section class="mapwrap">
      <div id="map"></div>
      <div id="toast" class="toast" hidden></div>
      <div class="modebar">
        <div class="mseg"><button data-mode="vertrauen" class="on">Vertrauen</button><button data-mode="streuen">Streuen</button></div>
        <button id="tbtn" class="tbtn">Temperaturen anzeigen</button>
        <div id="whatif" class="whatif" hidden>
          <div class="wt"><span>Was wäre wenn <i id="wl"></i></span><b id="wv"></b></div>
          <input type="range" id="wi" min="-8" max="12" step="0.5" aria-label="Temperatur">
          <button class="link" id="wlive" hidden>Live-Werte verwenden</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="detail" class="detail" hidden></div>
    </section>

    <div id="split" role="separator" aria-orientation="vertical" title="Breite ziehen"></div>

    <aside id="aside">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="betrieb" class="on">Betrieb</button>
        <button role="tab" data-tab="vertrauen">Vertrauen</button>
        <button role="tab" data-tab="kosten">Kosten</button>
      </nav>
      <div class="panel" id="tab-betrieb"></div>
      <div class="panel" id="tab-vertrauen" hidden></div>
      <div class="panel" id="tab-kosten" hidden></div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/dashboard.js"></script>
<script src="app.js"></script>
</body>
</html>
